{% extends 'base.html' %}
{% block content %}

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div id="map-wrapper-fullscreen">
    <div id="map-obj"></div>
</div>

<script>
    // LES DONNÉES (Mêmes que la liste pour cohérence)
    const LOCATIONS = [
        {lat: 34.005, lng: -6.845, price: "3500", city: "Rabat"},
        {lat: 33.996, lng: -6.849, price: "1200", city: "Rabat"},
        {lat: 33.575, lng: -7.620, price: "4000", city: "Casa"},
        {lat: 33.580, lng: -7.600, price: "1500", city: "Casa"},
        {lat: 35.760, lng: -5.830, price: "900", city: "Tanger"},
        {lat: 31.630, lng: -8.010, price: "3200", city: "Marrakech"}
    ];

    document.addEventListener("DOMContentLoaded", function() {
        // 1. Initialisation Map (Vue Globale Maroc)
        var map = L.map('map-obj', {
            zoomControl: false 
        }).setView([31.7917, -7.0926], 6);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 2. TUILES (OpenStreetMap standard - Infaillible)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        // 3. MARQUEURS PRIX (Style Airbnb)
        LOCATIONS.forEach(loc => {
            var icon = L.divIcon({
                className: 'custom-pin', 
                html: \<div class="price-marker-pin">\ MAD</div>\,
                iconSize: [60, 30],
                iconAnchor: [30, 15]
            });

            L.marker([loc.lat, loc.lng], {icon: icon})
             .addTo(map)
             .bindPopup(\<b>\</b><br>Logement dispo\);
        });

        // 4. Force Resize (Le fix ultime pour l'écran gris)
        setTimeout(() => { map.invalidateSize(); }, 200);
    });
</script>
{% endblock %}
