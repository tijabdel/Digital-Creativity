{% extends 'base.html' %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 80vh; background: #f7f9fc;">
    <div style="background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center;">
        <h2 style="color: #bc13fe; margin-bottom: 10px;">Bienvenue 👋</h2>
        <p class="text-muted" style="margin-bottom: 30px;">Connectez-vous à votre espace étudiant</p>
        
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Identifiant (ex: Assia)" class="form-control" style="background: white;">
            <input type="password" name="password" placeholder="Mot de passe" class="form-control" style="background: white;">
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">Se connecter</button>
        </form>
        <p style="margin-top: 20px; font-size: 12px; color: #a0aec0;">Pas de compte ? <a href="#" style="color: #bc13fe;">Créer un compte</a></p>
    </div>
</div>
{% endblock %}
