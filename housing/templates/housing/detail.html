{% extends 'base.html' %}
{% block content %}
<div class='container mt-5'>
    <div class='row'>
        <div class='col-md-8'>
            <img src='{{ listing.image_url }}' class='img-fluid rounded mb-4 w-100' style='max-height: 400px; object-fit: cover;'>
            <h2>{{ listing.title }}</h2>
            <p class='lead'>{{ listing.description }}</p>
            <hr>
            <ul class='list-unstyled'>
                <li>📍 <strong>Ville :</strong> {{ listing.city }}</li>
                <li>🎓 <strong>Proche de :</strong> {{ listing.university_nearby }}</li>
                <li>🏠 <strong>Type :</strong> {{ listing.type }}</li>
            </ul>
        </div>
        <div class='col-md-4'>
            <div class='card p-4 shadow-sm sticky-top' style='top: 100px;'>
                <h3 class='text-primary fw-bold text-center'>{{ listing.price }} DH</h3>
                <a href='https://wa.me/{{ listing.whatsapp_number }}' target='_blank' class='btn btn-success w-100 my-3 rounded-pill'>
                    <i class='fab fa-whatsapp'></i> Contacter sur WhatsApp
                </a>
                <form method='POST'>
                    {% csrf_token %}
                    <label>Ou laisser un message :</label>
                    <textarea name='message' class='form-control mb-2' required></textarea>
                    <button type='submit' class='btn btn-primary w-100 rounded-pill'>Envoyer</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
