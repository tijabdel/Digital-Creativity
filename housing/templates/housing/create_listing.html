{% extends 'base.html' %}
{% block content %}
<div class='container mt-5'>
    <div class='row justify-content-center'>
        <div class='col-md-8'>
            <div class='card p-5 shadow-sm'>
                <h2 class='fw-bold mb-4 text-center'>📢 Publier une annonce</h2>
                <form method='POST'>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class='alert alert-info small'><i class='fas fa-info-circle'></i> Astuce: Pour l'image, faites clic-droit sur une image Google > Copier l'adresse de l'image.</div>
                    <button type='submit' class='btn btn-primary w-100 btn-lg rounded-pill mt-3'>Mettre en ligne</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
